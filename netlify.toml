[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NPM_FLAGS = "--omit=dev"   # skip hardhat on Netlify; you deploy the contract from your own computer

[functions]
  node_bundler = "esbuild"

# Send every /api/* call to the single API function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'"
